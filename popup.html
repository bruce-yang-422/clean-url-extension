<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clean URL</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <header class="brand">
      <img class="brand-icon" src="icons/icon-32.png" width="32" height="32" alt="">
      <div class="brand-title"><h1>Clean URL</h1><span id="extension-version" class="version"></span></div>
      <span class="brand-badge"><span class="badge-dot" aria-hidden="true"></span><span data-i18n="brandBadge">乾淨連結</span></span>
    </header>

    <section class="card" aria-labelledby="original-label">
      <h2 id="original-label" data-i18n="originalLabel">目前網址</h2>
      <p id="original-url" class="url" dir="ltr" data-i18n="reading">正在讀取目前分頁…</p>
    </section>
      <div id="clean-status" class="status" role="status" aria-live="polite">
        <span class="status-icon" aria-hidden="true">✓</span>
        <span id="status-text" data-i18n="checking">正在檢查網址…</span>
      </div>

    <section id="clean-section" class="card clean-card">
      <h2><label id="clean-label" for="clean-url" data-i18n="cleanLabel">乾淨連結</label> <span class="ready-badge">READY</span></h2>
      <!-- 可直接編輯；複製按鈕永遠複製欄位目前的內容。 -->
      <textarea id="clean-url" class="url" dir="ltr" rows="3" spellcheck="false" autocomplete="off" aria-describedby="clean-hint">—</textarea>
      <p id="clean-hint" class="hint" data-i18n="cleanEditable">可直接編輯後再複製</p>
    </section>

    <button id="copy-button" type="button" disabled>
      <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="14" rx="2"/><path d="M15 4H5a2 2 0 0 0-2 2v12"/></svg>
      <span id="copy-label" data-i18n="copyClean">複製乾淨連結</span>
    </button>
    <p id="copy-feedback" role="status" aria-live="polite"></p>
    <footer>
      <span class="privacy-note"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/><path d="m8 12 3 3 5-6"/></svg><span data-i18n="privacyNote">僅在本機處理・不會上傳網址</span></span>
      <details><summary data-i18n="privacySummary">隱私說明</summary><p><span data-i18n="privacyDetail">只在你開啟彈窗或使用右鍵選單時讀取網址，不儲存瀏覽紀錄、不傳送網址。按下複製時，將結果寫入系統剪貼簿。</span><a href="https://cleanlink.stack-base.com/privacy.html" target="_blank" rel="noopener noreferrer" data-i18n="privacyLink">完整隱私權政策</a></p></details>
    </footer>
  </main>
</body>
</html>
